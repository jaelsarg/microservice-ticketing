name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AZ_CONTAINER_NAME: howestprime-ticketing
  CONTAINER_VERSION_TAG: ${{ github.sha }}

jobs:
  testing:
    name: Testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    # Your QA steps will go here
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x
    
    - name: Install dependencies
      run: deno install
    
    - name: Deno check
      run: deno check src/

    - name: Deno lint
      run: deno lint src
    
    - name: Run unit tests
      run: deno test --allow-all

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    # Your code coverage steps will go here
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x
        
    - name: Install dependencies
      run: deno install
      
    - name: Run tests with coverage
      run: deno test --coverage=coverage --allow-all
      
    - name: Check coverage threshold
      run: |
        coverage_report="$(deno coverage --exclude=tests coverage)"
        echo "$coverage_report"
        
        COVERAGE="$(echo "$coverage_report" | grep "All files" | awk -F'|' '{print $3}' | sed 's/\x1B\[[0-9;]*m//g' | tr -d '[:space:]')"
        COVERAGE_INT="${COVERAGE%.*}"
        
        if [[ $COVERAGE_INT -lt 50 ]]; then
          echo "Code coverage is below threshold of 50%"
          exit 1
        fi
        
        echo "Code coverage meets threshold of 50%"

  build:
    name: Push Docker image to Azure Container Registry
    runs-on: ubuntu-latest
    needs: code-coverage
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      
      - name: Login to registry ${{ vars.AZ_CONTAINER_REGISTRY }}
        uses: azure/docker-login@v1
        with:
          login-server: ${{ vars.AZ_CONTAINER_REGISTRY }}
          username: ${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL }}
          password: ${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL_PASSWORD }}
          
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v4
        with:
          file: ../../config/Dockerfile
          push: true
          tags: ${{ vars.AZ_CONTAINER_REGISTRY }}/${{ env.AZ_CONTAINER_NAME }}:${{ env.CONTAINER_VERSION_TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Log in to Azure
        run: az login --service-principal --username ${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL }} --password ${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL_PASSWORD }} --tenant ${{ vars.AZ_TENANT_ID }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp create \
          --name ${{ env.AZ_CONTAINER_NAME }} \
          --resource-group ${{ vars.AZ_RESOURCE_GROUP }} \
          --environment ${{ vars.AZ_CONTAINER_ENVIRONMENT }} \
          --image ${{ vars.AZ_CONTAINER_REGISTRY }}/${{ env.AZ_CONTAINER_NAME }}:${{env.CONTAINER_VERSION_TAG}} \
          --registry-server ${{ vars.AZ_CONTAINER_REGISTRY }} \
          --registry-username ${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL }} \
          --registry-password ${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL_PASSWORD }} \
          --user-assigned "${{ vars.HOWESTPRIME_WIDE_MI_KEYVAULTREADER_URI }}" \
          \
          --secrets \
          "db-password=keyvaultref=${{vars.HOWESTPRIME_TICKETING_P_DOCUMENTDB_PASSWORD_URI}},identityref:${{vars.HOWESTPRIME_WIDE_MI_KEYVAULTREADER_URI}}" \
          "mb-password=keyvaultref=${{vars.HOWESTPRIME_WIDE_P_MESSAGEBROKER_PASSWORD_URI}},identityref:${{vars.HOWESTPRIME_WIDE_MI_KEYVAULTREADER_URI}}" \
          \
          --env-vars \
          "PERSISTENCE_MONGO_DB_PROTOCOL=${{vars.HOWESTPRIME_TICKETING_P_DOCUMENTDB_PROTOCOL}}" \
          "PERSISTENCE_MONGO_DB_USER=${{vars.HOWESTPRIME_TICKETING_P_DOCUMENTDB_LOGIN}}" \
          "PERSISTENCE_MONGO_DB_PORT=${{vars.HOWESTPRIME_TICKETING_P_DOCUMENTDB_PORT}}" \
          "PERSISTENCE_MONGO_DB_HOST=${{vars.HOWESTPRIME_TICKETING_P_DOCUMENTDB_HOST}}" \
          "PERSISTENCE_MONGO_DB_NAME=${{vars.HOWESTPRIME_TICKETING_P_DOCUMENTDB_DB}}" \
          "PERSISTENCE_MONGO_DB_OPTIONS=${{vars.HOWESTPRIME_TICKETING_P_DOCUMENTDB_OPTIONS}}" \
          "PERSISTENCE_MONGO_DB_PASS=secretref:db-password" \
          "MESSAGING_LAVINMQ_HOSTNAME=${{vars.HOWESTPRIME_WIDE_P_MESSAGEBROKER_HOSTNAME}}" \
          "MESSAGING_LAVINMQ_VHOST=${{vars.HOWESTPRIME_WIDE_P_MESSAGEBROKER_VHOST}}" \
          "MESSAGING_LAVINMQ_PASS=secretref:mb-password" \
          "MESSAGING_LAVINMQ_USER=${{vars.HOWESTPRIME_WIDE_P_MESSAGEBROKER_LOGIN}}" \
          "MESSAGING_LAVINMQ_ASYNCAPI=${{vars.HOWESTPRIME_TICKETING_P_ASYNCAPI_URI}}" \
          "WEBAPI_PORT=${{vars.HOWESTPRIME_TICKETING_P_WEBAPI_PORT}}" \
          "WEBAPI_HOST=${{vars.HOWESTPRIME_TICKETING_P_WEBAPI_HOST}}" \

          az containerapp ingress enable \
          --name ${{ env.AZ_CONTAINER_NAME }} \
          --resource-group ${{ vars.AZ_RESOURCE_GROUP }} \
          --type external \
          --target-port 8000 