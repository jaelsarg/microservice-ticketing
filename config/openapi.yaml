openapi: 3.0.3
info:
    title: Suggestion Service Web API
    version: 1.0.0
    description: |
        HTTP API for creating and querying suggestions.

servers:
    - url: http://localhost:8000
      description: Local development server

tags:
    - name: Orders
      description: Manage orders for movie tickets
    - name: Payments
      description: Process payments for orders

paths:
    /api/orders/{orderId}/customer:
        post:
            tags:
                - Orders
            summary: Add customer to order
            operationId: addCustomerToOrder
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AddCustomerToOrderRequest'
                        examples:
                            addCustomerToOrder:
                                value:
                                    salutation: Mr.
                                    firstName: John
                                    lastName: Doe
                                    email: john.doe@email.com
                                    agreeToTerms: true
            responses:
                '201':
                    description: Customer added to order
                    headers:
                        Location:
                            $ref: '#/components/headers/Location'
                '400':
                    $ref: '#/components/responses/BadRequestProblem'
                '404':
                    $ref: '#/components/responses/NotFoundProblem'
                '500':
                    $ref: '#/components/responses/InternalServerErrorProblem'

    /api/orders/{bookingId}:
        get:
            tags:
                - Orders
            summary: Gets the orders for a booking Id
            operationId: getOrderByBookingId
            responses:
                '200':
                    description: Orders retrieved
                    content:
                        application/json:
                            schema: 
                                type: array
                                items:
                                    $ref: '#/components/schemas/OrderResponse'
                '400':
                    $ref: '#/components/responses/BadRequestProblem'
                '404':
                    $ref: '#/components/responses/NotFoundProblem'
                '500':
                    $ref: '#/components/responses/InternalServerErrorProblem'

    /api/orders/{orderId}/payments:
        post:
            tags:
                - Payments
            summary: Pay for an order
            operationId: payForOrder
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PayOrderRequest'
                        examples:
                            payForOrder:
                                value:
                                    orderId: 123e4567-e89b-12d3-a456-426614174000
                                    externalId: 123e4567-e89b-12d3-a456-426614174000
                                    paymentMethod: credit_card
                                    cardNumber: 4111111111111111
                                    expiryDate: 12/2025
                                    cvv: 123
                                    bookingId: 123e4567-e89b-12d3-a456-426614174000
                                    amount: 29.99
            responses:
                '201':
                    description: Payment processed
                    headers:
                        Location:
                            $ref: '#/components/headers/Location'
                '400':
                    $ref: '#/components/responses/BadRequestProblem'
                '404':
                    $ref: '#/components/responses/NotFoundProblem'
                '500':
                    $ref: '#/components/responses/InternalServerErrorProblem'

components:
    parameters:
        OrderId:
            name: orderId
            in: path
            required: true
            description: Order identifier
            schema:
                $ref: '#/components/schemas/UUID'
        BookingId:
            name: bookingId
            in: path
            required: true
            description: Booking identifier
            schema:
                $ref: '#/components/schemas/UUID'

    headers:
        Location:
            description: URI of the created resource
            schema:
                type: string
                format: uri-reference
            example: /api/suggestions/8fdd8b8e-8de4-4b9a-8e16-868b72f4f469

    responses:
        BadRequestProblem:
            description: Validation or domain/application error
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/ProblemDetails'
        NotFoundProblem:
            description: Resource not found
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/ProblemDetails'
        InternalServerErrorProblem:
            description: Unhandled server error
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/ProblemDetails'

    schemas:
        AddCustomerToOrderRequest:
            type: object
            required:
                - salutation
                - firstName
                - lastName
                - email
                - agreeToTerms
            properties:
                salutation:
                    type: string
                    description: Customer's salutation
                    enum:
                        - Mr.
                        - Ms.
                        - Mx.
                    example: Mr.
                firstName:
                    type: string
                    description: Customer's first name
                    example: John
                lastName:
                    type: string
                    description: Customer's last name
                    example: Doe
                email:
                    type: string
                    format: email
                    description: Customer's email address
                    example: john.doe@email.com
                agreeToTerms:
                    type: boolean
                    description: Whether the customer agrees to the terms and conditions
                    example: true

        PayOrderRequest:
            type: object
            required:
                - orderId
                - externalId
                - paymentMethod
                - cardNumber
                - expiryDate
                - CVV
                - bookingId
                - amount
            properties:
                orderId:
                    type: string
                    format: uuid
                    description: Order identifier
                    example: 123e4567-e89b-12d3-a456-426614174000
                externalId:
                    type: string
                    format: uuid
                    description: External identifier
                    example: 123e4567-e89b-12d3-a456-426614174000
                paymentMethod:
                    type: string
                    description: Method of payment
                    enum:
                        - Credit Card
                        - Bank Transfer
                    example: Credit Card
                cardNumber:
                    type: string
                    description: Card number
                    example: 4111111111111111
                expiryDate:
                    type: string
                    description: Card expiry date
                    example: 12/2025
                cvv:
                    type: string
                    description: Card CVV code
                    example: 123
                bookingId:
                    type: string
                    format: uuid
                    description: Booking identifier
                    example: 123e4567-e89b-12d3-a456-426614174000
                amount:
                    type: number
                    description: Payment amount
                    example: 29.99

        OrderResponse:
            type: object
            required:
                - id
                - bookingId
                - status
                - price
                - agreeToTerms
                - tickets
            properties:
                id:
                    $ref: '#/components/schemas/UUID'
                bookingId:
                    $ref: '#/components/schemas/UUID'
                status:
                    type: string
                    enum:
                        - open
                        - paid
                        - ticketReleased
                        - cancelled
                    example: open
                price:
                    type: number
                    example: 29.99
                agreeToTerms:
                    type: boolean
                    example: true
                customer:
                    type: object
                    required:
                        - salutation
                        - firstName
                        - lastName
                        - email
                    properties:
                        salutation:
                            type: string
                            description: Customer's salutation
                            enum:
                                - Mr.
                                - Ms.
                                - Mx.
                            example: Mr.
                        firstName:
                            type: string
                            description: Customer's first name
                            example: John
                        lastName:
                            type: string
                            description: Customer's last name
                            example: Doe
                        email:
                            type: string
                            format: email
                            description: Customer's email address
                            example:
                    tickets:
                        type: array
                        items:
                            type: object
                            required:
                                - ticketId
                                - seatNumber
                                - visitorType
                                - price
                                - movieId
                                - room
                                - showtime
                            properties:
                                ticketId:
                                    $ref: '#/components/schemas/UUID'
                                seatNumber:
                                    type: number
                                    example: 12
                                visitorType:
                                    type: string
                                    enum:
                                        - standard
                                        - discounted
                                    example: standard
                                price:
                                    type: number
                                    example: 14.99
                                movieId:
                                    $ref: '#/components/schemas/UUID'
                                room:
                                    type: string
                                    example: Blue room
                                showtime:
                                    type: string
                                    format: date-time
                                    example: 2024-07-01T19:30:00Z
                               
        UUID:
            type: string
            format: uuid
