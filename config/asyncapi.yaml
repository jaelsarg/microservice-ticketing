asyncapi: 3.1.0
info:
    title: Howestprime.Ticketing
    version: 1.0.0
    description: The AsyncAPI specification describes the message broker configuration for the Howestprime.Ticketing SAAS.
    x-metadata:
        BoundedContext: Ticketing

defaultContentType: application/json

servers:
    messageBroker:
        host: '{host}'
        protocol: amqp
        description: Local AMQP message broker
        variables:
            host:
                default: localhost:5672
                description: Host and port of the AMQP broker
        bindings:
            amqp:
                virtualHost: /

channels:
    # Receive channels
    Howestprime.Movies.Movie.MovieRegistered:
        address: howestprime.movies.movie.movieregistered
        title: Movie registered
        messages:
            MovieRegistered:
                $ref: '#/components/messages/MovieRegistered'
        bindings:
            amqp:
                is: routingKey
                exchange:
                    name: howestprime
                    type: topic
                    routingKey: howestprime.movies.movie.movieregistered
    
    Howestprime.Movies.MovieEvent.BookingOpened:
        address: howestprime.movies.movieevent.bookingopened
        title: Booking opened
        messages:
            BookingOpened:
                $ref: '#/components/messages/BookingOpened'
        bindings:
            amqp:
                is: routingKey
                exchange:
                    name: howestprime
                    type: topic
                    routingKey: howestprime.movies.movieevent.bookingopened

    # Send channels
    Howestprime.Ticketing.Payment.PaymentSuccess:
        address: howestprime.ticketing.payment.paymentsuccess
        title: Send payment success message
        messages:
            PaymentSuccess:
                $ref: '#/components/messages/PaymentSuccess'
        bindings:
            amqp:
                is: routingKey
                exchange:
                    name: howestprime
                    type: topic
                    routingKey: howestprime.ticketing.payment.paymentsuccess

    Howestprime.Ticketing.Payment.PaymentFailed:
        address: howestprime.ticketing.payment.paymentfailed
        title: Send payment failed message
        messages:
            PaymentFailed:
                $ref: '#/components/messages/PaymentFailed'
        bindings:
            amqp:
                is: routingKey
                exchange:
                    name: howestprime
                    type: topic
                    routingKey: howestprime.ticketing.payment.paymentfailed

    Howestprime.Ticketing.Payment.TicketsReleased:
        address: howestprime.ticketing.payment.ticketsreleased
        title: Send tickets released message
        messages:
            TicketsReleased:
                $ref: '#/components/messages/TicketsReleased'
        bindings:
            amqp:
                is: routingKey
                exchange:
                    name: howestprime
                    type: topic
                    routingKey: howestprime.ticketing.payment.ticketsreleased
    
    Howestprime.Ticketing.Payment.CustomerInfoAdded:
        address: howestprime.ticketing.payment.customerinfoadded
        title: Send customer info added message
        messages:
            CustomerInfoAdded:
                $ref: '#/components/messages/CustomerInfoAdded'
        bindings:
            amqp:
                is: routingKey
                exchange:
                    name: howestprime
                    type: topic
                    routingKey: howestprime.ticketing.payment.customerinfoadded

    # Suggestions
    thirdparty.service.suggestions.sendcreatesuggestion:
        address: thirdparty.service.suggestions.sendcreatesuggestion
        title: Send create suggestion
        messages:
            SuggestionSendCreateSuggestion:
                $ref: '#/components/messages/SuggestionSendCreateSuggestion'
        bindings:
            amqp:
                is: routingKey
                exchange:
                    name: howestprime
                    type: topic
                    routingKey: thirdparty.service.suggestions.sendcreatesuggestion

    howestprime.ticketing.suggestions.created:
        address: howestprime.ticketing.suggestions.created
        title: Suggestion created
        messages:
            SuggestionCreated:
                $ref: '#/components/messages/SuggestionCreated'
        bindings:
            amqp:
                is: routingKey
                exchange:
                    name: howestprime
                    type: topic
                    routingKey: howestprime.ticketing.suggestions.created

operations:
    # Receive operations
    WhenMovieRegisteredSaveMovie:
        action: receive
        channel:
            $ref: '#/channels/Howestprime.Movies.Movie.MovieRegistered'
        description: Handles a MovieRegistered event from the Howestprime Movies service.
        messages:
            - $ref: '#/channels/Howestprime.Movies.Movie.MovieRegistered/messages/MovieRegistered'
    
    WhenBookingOpenedCreateOrder:
        action: receive
        channel:
            $ref: '#/channels/Howestprime.Movies.MovieEvent.BookingOpened'
        description: Handles a BookingOpened event from the Howestprime Movies service.
        messages:
            - $ref: '#/channels/Howestprime.Movies.MovieEvent.BookingOpened/messages/BookingOpened'

    # Send operations
    PaymentSuccess:
        action: send
        channel:
            $ref: '#/channels/Howestprime.Ticketing.Payment.PaymentSuccess'
        description: Publishes a PaymentSuccess message after a successful payment.
        messages:
            - $ref: '#/channels/Howestprime.Ticketing.Payment.PaymentSuccess/messages/PaymentSuccess'

    PaymentFailed:
        action: send
        channel:
            $ref: '#/channels/Howestprime.Ticketing.Payment.PaymentFailed'
        description: Publishes a PaymentFailed message after a failed payment.
        messages:
            - $ref: '#/channels/Howestprime.Ticketing.Payment.PaymentFailed/messages/PaymentFailed'
    
    TicketsReleased:
        action: send
        channel:
            $ref: '#/channels/Howestprime.Ticketing.Payment.TicketsReleased'
        description: Publishes a TicketsReleased message after tickets have been released.
        messages:
            - $ref: '#/channels/Howestprime.Ticketing.Payment.TicketsReleased/messages/TicketsReleased'
    
    CustomerInfoAdded:
        action: send
        channel:
            $ref: '#/channels/Howestprime.Ticketing.Payment.CustomerInfoAdded'
        description: Published a CustomerInfoAdded message
        messages:
            - $ref: '#/channels/Howestprime.Ticketing.Payment.CustomerInfoAdded/messages/CustomerInfoAdded'

    # Suggestions
    WhenSuggestionSendCreateSuggestion:
        action: receive
        channel:
            $ref: '#/channels/thirdparty.service.suggestions.sendcreatesuggestion'
        description: |
            Triggered when an external producer requests suggestion creation.
            Consumes the message and delegates to the CreateSuggestion command use case.
        messages:
            - $ref: '#/channels/thirdparty.service.suggestions.sendcreatesuggestion/messages/SuggestionSendCreateSuggestion'

    sendSuggestionCreated:
        action: send
        channel:
            $ref: '#/channels/howestprime.ticketing.suggestions.created'
        description: |
            Triggered after a suggestion is created successfully.
            Publishes the created suggestion payload for downstream consumers.
        messages:
            - $ref: '#/channels/howestprime.ticketing.suggestions.created/messages/SuggestionCreated'

components:
    messages:
        MovieRegistered:
            name: MovieRegistered
            title: Movie registered
            summary: Indicates a new movie has been registered
            payload:
                $ref: '#/components/schemas/MovieRegisteredPayload'
        BookingOpened:
            name: BookingOpened
            title: Booking opened
            summary: Indicates that booking has been opened for a movie
            payload:
                $ref: '#/components/schemas/BookingOpenedPayload'
        PaymentSuccess:
            name: PaymentSuccess
            title: Payment success
            summary: Indicates that a payment has been processed successfully.
            payload:
                $ref: '#/components/schemas/PaymentSuccessPayload'
        PaymentFailed:
            name: PaymentFailed
            title: Payment failed
            summary: Indicates that a payment has failed.
            payload:
                $ref: '#/components/schemas/PaymentFailedPayload'
        TicketsReleased:
            name: TicketsReleased
            title: Tickets released
            summary: Indicates that tickets have been released after a successful payment.
            payload:
                $ref: '#/components/schemas/TicketsReleasedPayload'
        CustomerInfoAdded:
            name: CustomerInfoAdded
            title: Customer info added
            summary: Indicates that customer info has been added
            payload:
                $ref: '#/components/schemas/CustomerInfoAddedPayload'

        # Suggestion
        SuggestionSendCreateSuggestion:
            name: SuggestionSendCreateSuggestion
            title: Suggestion create request
            summary: Request message to create a suggestion.
            payload:
                $ref: '#/components/schemas/SuggestionSendCreateSuggestionPayload'

        SuggestionCreated:
            name: SuggestionCreated
            title: Suggestion created
            summary: Event message emitted after a suggestion is created.
            payload:
                $ref: '#/components/schemas/SuggestionCreatedPayload'

    schemas:
        MovieRegisteredPayload:
            type: object
            required:
                - movieId
                - title
                - duration
                - genres
                - ageRating
                - posterUrl
            properties:
                movieId:
                    type: string
                    format: uuid
                title:
                    type: string
                releaseYear:
                    type: integer
                duration:
                    type: integer
                genres:
                    type: array
                    items:
                        type: string
                actors:
                    type: array
                    items:
                        type: string
                ageRating:
                    type: integer
                posterUrl:
                    type: string
        BookingOpenedPayload:
            type: object
            required:
                - bookingId
                - movieId
                - room
                - showtime
                - standardVisitors
                - discountedVisitors
                - seatNumbers
            properties:
                bookingId:
                    type: string
                    format: uuid
                movieId:
                    type: string
                    format: uuid
                room:
                    type: string
                showtime:
                    type: string
                    format: date-time
                standardVisitors:
                    type: integer
                discountedVisitors:
                    type: integer
                seatNumbers:
                    type: array
                    items:
                        type: integer
        PaymentSuccessPayload:
            type: object
            required:
                - paymentId
                - orderId
                - bookingId
            properties:
                paymentId:
                    type: string
                    format: uuid
                orderId:
                    type: string
                    format: uuid
                bookingId:
                    type: string
                    format: uuid
        PaymentFailedPayload:
            type: object
            required:
                - paymentId
                - orderId
                - bookingId
                - reason
            properties:
                paymentId:
                    type: string
                    format: uuid
                orderId:
                    type: string
                    format: uuid
                bookingId:
                    type: string
                    format: uuid
                reason:
                    type: string
        TicketsReleasedPayload:
            type: object
            required:
                - bookingId
                - customer
                - tickets
            properties:
                bookingId:
                    type: string
                    format: uuid
                customer:
                    type: object
                    required:
                        - salutation
                        - firstName
                        - lastName
                        - email
                    properties:
                        salutation:
                            type: string
                            enum: [Mr., Ms., Dr., Prof.]
                        firstName:
                            type: string
                        lastName:
                            type: string
                        email:
                            type: string
                            format: email
                tickets:
                    type: array
                    items:
                        type: object
                        required:
                            - ticketId
                            - movieId
                            - room
                            - seatNumber
                            - visitorType
                            - price
                            - showtime
                        properties:
                            ticketId:
                                type: string
                                format: uuid
                            movieId:
                                type: string
                                format: uuid
                            room:
                                type: string
                            seatNumber:
                                type: integer
                            visitorType:
                                type: string
                                enum: [standard, discounted]
                            price:
                                type: number
                                format: float
                            showtime:
                                type: string
                                format: date-time
        CustomerInfoAddedPayload:
            type: object
            required:
                - salutation
                - firstName
                - lastName
                - email
            properties:
                salutation:
                    type: string
                    enum: [Mr., Ms., Dr., Prof.]
                firstName:
                    type: string
                lastName:
                    type: string
                email:
                    type: string
                    format: email

        # Suggestions
        SuggestionSendCreateSuggestionPayload:
            type: object
            required:
                - email
                - title
                - description
            properties:
                email:
                    type: string
                    format: email
                    maxLength: 254
                    description: Email address of the suggestion author.
                    example: user@example.com
                title:
                    type: string
                    minLength: 3
                    maxLength: 120
                    description: Short title of the suggestion.
                    example: Improve booking performance
                description:
                    type: string
                    minLength: 10
                    maxLength: 2000
                    description: Detailed suggestion text.
                    example: Cache frequently requested movie data to reduce latency.

        SuggestionCreatedPayload:
            type: object
            required:
                - suggestionId
                - email
                - title
                - description
                - occurredOn
            properties:
                suggestionId:
                    type: string
                    format: uuid
                    description: Identifier of the created suggestion.
                    example: 8fdd8b8e-8de4-4b9a-8e16-868b72f4f469
                email:
                    type: string
                    format: email
                    maxLength: 254
                    description: Email address of the suggestion author.
                    example: user@example.com
                title:
                    type: string
                    minLength: 3
                    maxLength: 120
                    description: Short title of the suggestion.
                    example: Improve booking performance
                description:
                    type: string
                    minLength: 10
                    maxLength: 2000
                    description: Detailed suggestion text.
                    example: Cache frequently requested movie data to reduce latency.
                occurredOn:
                    type: string
                    format: date-time
                    description: UTC timestamp when the event occurred.
                    example: '2026-03-24T10:15:30.000Z'
